name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --extra dev --extra kokoro --extra cpu --locked
      - run: uv run pytest
      - run: uv run ruff check .

      - name: Validate Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -Raw $_.FullName))
          }
